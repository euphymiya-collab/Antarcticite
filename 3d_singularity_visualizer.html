<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singularity - Interactive 3D Black Hole Visualizer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=JetBrains+Mono:ital,wght@0,300;0,500;1,400&display=swap" rel="stylesheet">
    
    <!-- ES Module Shims & Import Maps -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.65) 100%);
            z-index: 10;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .title {
            font-size: 1.4rem;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: opacity 0.5s ease;
        }
        .status-pill {
            display: inline-block;
            padding: 6px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        .metric {
            margin-bottom: 8px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 4px;
            border-left: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }
        .val {
            color: #00f3ff;
            font-weight: bold;
            transition: color 1.2s ease;
        }
        
        /* Interactive Control Panel */
        .controls-panel {
            pointer-events: auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .btn-ctrl {
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn-ctrl.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            color: #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }
        
        #vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 150%);
            pointer-events: none;
            z-index: 5;
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            #overlay { padding: 18px; }
            .title { font-size: 1rem; letter-spacing: 0.5em; }
            .hud-bottom { flex-direction: column; align-items: flex-start; gap: 10px; }
            .btn-ctrl { padding: 6px 12px; font-size: 0.62rem; }
        }
    </style>
</head>
<body>

<div id="vignette"></div>
<div id="overlay">
    <div class="header">
        <div class="title" id="main-title">宇宙黑洞</div>
        <div class="status-pill" id="status-text">拓撲結構：正常</div>
    </div>

    <!-- Center Interactive State Switcher -->
    <div class="controls-panel">
        <button class="btn-ctrl active" id="btn-state-0" onclick="window.setSingularityState(0)">穩定態</button>
        <button class="btn-ctrl" id="btn-state-1" onclick="window.setSingularityState(1)">湍流態</button>
        <button class="btn-ctrl" id="btn-state-2" onclick="window.setSingularityState(2)">坍縮態</button>
        <button class="btn-ctrl" id="btn-state-3" onclick="window.setSingularityState(3)">量子場</button>
        <button class="btn-ctrl" id="btn-audio" onclick="window.toggleAudio()">🔊 音效關閉</button>
    </div>

    <div class="hud-bottom">
        <div>
            <div class="metric">MASS_INDEX: <span class="val">4.2M SOL</span></div>
            <div class="metric">LENSING: <span class="val" id="lensing-val">SCHWARZSCHILD</span></div>
        </div>
        <div style="text-align: right">
            <div class="metric">RELATIVITY: <span class="val" id="vel-val">0.45c</span></div>
            <div class="metric">RADIATION: <span class="val" id="rad-val">DETECTION ON</span></div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(60, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
    controls.maxDistance = 180;
    controls.minDistance = 15;

    const noiseChunk = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }
    `;

    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    // Dark Event Horizon
    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const bhGeo = new THREE.SphereGeometry(4, 64, 64);
    coreGroup.add(new THREE.Mesh(bhGeo, bhMat));

    // Gravitational Photon Sphere / Aura Shading
    const auraMat = new THREE.ShaderMaterial({
        uniforms: { 
            uTime: { value: 0 }, 
            uIntensity: { value: 1.0 },
            uBaseColor: { value: new THREE.Color('#ff7711') }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vView = normalize(-(modelViewMatrix * vec4(position, 1.0)).xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uIntensity;
            uniform vec3 uBaseColor;
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                float rim = pow(1.0 - max(dot(vNormal, vView), 0.0), 3.5);
                gl_FragColor = vec4(uBaseColor * rim * uIntensity * 4.5, 1.0);
            }
        `,
        side: THREE.BackSide,
        transparent: true,
        blending: THREE.AdditiveBlending
    });
    coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(4.25, 64, 64), auraMat));

    const instanceCount = 6500;
    const streakGeo = new THREE.CylinderGeometry(0.01, 0.14, 2.4, 3);
    streakGeo.rotateX(Math.PI / 2);

    const diskMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMorph: { value: 0.1 },
            uCompression: { value: 1.0 },
            uIntensity: { value: 1.0 },
            uOrbitScale: { value: 1.0 },
            uHueShift: { value: 0.0 }
        },
        vertexShader: `
            ${noiseChunk}
            uniform float uTime;
            uniform float uMorph;
            uniform float uCompression;
            uniform float uIntensity;
            uniform float uOrbitScale;
            uniform float uHueShift;
            varying vec3 vColor;
            varying float vOpacity;

            void main() {
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                float rOriginal = length(instPos.xz);
                float r = rOriginal * uCompression;
                
                float initialAngle = atan(instPos.z, instPos.x);
                float orbitalVelocity = (1.5 / sqrt(rOriginal)) * uOrbitScale;
                float currentAngle = initialAngle + (uTime * orbitalVelocity);
                
                vec3 morphedWorldPos = vec3(cos(currentAngle) * r, instPos.y, sin(currentAngle) * r);
                float noise = snoise(vec3(morphedWorldPos.x * 0.08, morphedWorldPos.z * 0.08, uTime * 0.3));
                morphedWorldPos.y += noise * uMorph * 3.5;

                // Relativistic Doppler Effect Simulation
                vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
                vec3 orbitDir = normalize(vec3(-sin(currentAngle), 0.0, cos(currentAngle)));
                float doppler = dot(orbitDir, viewDir);

                // Dynamic Color Gradients based on Distance & Doppler
                vec3 hot = vec3(1.0, 0.95, 0.9);
                vec3 warm = vec3(1.0, 0.45, 0.1);
                vec3 cool = vec3(0.1, 0.35, 1.0);

                if (uHueShift > 0.5) {
                    // Quantum Hyper-State Color Palette
                    warm = vec3(0.0, 0.9, 0.8);
                    cool = vec3(0.8, 0.1, 0.9);
                }

                vec3 color = mix(cool, warm, smoothstep(45.0, 12.0, r));
                color = mix(color, hot, smoothstep(10.0, 4.0, r));

                vColor = color * (1.3 + doppler * 0.7) * uIntensity;
                vOpacity = (smoothstep(3.8, 5.5, r) * (1.0 - smoothstep(38.0, 48.0, r))) * 0.85;

                float deltaAngle = currentAngle - initialAngle;
                float c = cos(deltaAngle);
                float s = sin(deltaAngle);
                mat3 rotY = mat3(
                    c, 0, s,
                    0, 1, 0,
                   -s, 0, c
                );

                vec3 localPos = (instanceMatrix * vec4(position, 0.0)).xyz;
                vec3 rotatedLocalPos = rotY * localPos;

                gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < instanceCount; i++) {
        const r = 5 + Math.pow(Math.random(), 1.3) * 40;
        const angle = Math.random() * Math.PI * 2;
        dummy.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * (7 / r), Math.sin(angle) * r);
        dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
        dummy.updateMatrix();
        instancedDisk.setMatrixAt(i, dummy.matrix);
    }
    scene.add(instancedDisk);

    let audioCtx = null;
    let mainGain = null;
    let osc1 = null;
    let isAudioPlaying = false;

    function initAudio() {
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        mainGain = audioCtx.createGain();
        mainGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

        // Low frequency hum
        osc1 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(180, audioCtx.currentTime);

        osc1.connect(filter);
        filter.connect(mainGain);
        mainGain.connect(audioCtx.destination);
        osc1.start();
    }

    window.toggleAudio = function() {
        if (!audioCtx) initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        isAudioPlaying = !isAudioPlaying;
        const btn = document.getElementById('btn-audio');
        if (isAudioPlaying) {
            mainGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.1);
            btn.innerText = "🔊 音效開啟";
            btn.classList.add('active');
        } else {
            mainGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.1);
            btn.innerText = "🔇 音效關閉";
            btn.classList.remove('active');
        }
    };

    const config = [
        { 
            title: "宇宙黑洞：穩定奇異點", status: "拓撲結構：正常", 
            morph: 0.1, compress: 1.0, intensity: 1.0, rotate: 0.4, camY: 25, camDist: 85, orbit: 1.0,
            color: "#00f3ff", vel: "0.45c", hueShift: 0.0, auraColor: '#ff7711', lensing: "SCHWARZSCHILD"
        },
        { 
            title: "宇宙黑洞：吸積湍流", status: "拓撲結構：波動", 
            morph: 4.5, compress: 1.15, intensity: 1.4, rotate: 1.5, camY: 45, camDist: 95, orbit: 1.8,
            color: "#ffaa00", vel: "0.78c", hueShift: 0.0, auraColor: '#ff4400', lensing: "KERR DYNAMICS"
        },
        { 
            title: "宇宙黑洞：相對論坍縮", status: "拓撲結構：臨界", 
            morph: 0.8, compress: 0.38, intensity: 3.5, rotate: 5.0, camY: 12, camDist: 55, orbit: 4.5,
            color: "#ff0044", vel: "0.99c", hueShift: 0.0, auraColor: '#ff0033', lensing: "EVENT HORIZON LEAK"
        },
        { 
            title: "宇宙黑洞：量子場漲落", status: "拓撲結構：疊加", 
            morph: 2.2, compress: 0.85, intensity: 2.2, rotate: 2.0, camY: -30, camDist: 70, orbit: 2.5,
            color: "#a855f7", vel: "0.88c", hueShift: 1.0, auraColor: '#00e5ff', lensing: "HAWKING FIELD"
        }
    ];

    let stateIdx = 0;
    let autoCycleTimer = null;
    const mainTitle = document.getElementById('main-title');
    const statusText = document.getElementById('status-text');
    const velVal = document.getElementById('vel-val');
    const lensingVal = document.getElementById('lensing-val');
    const camControl = { distance: 85 };

    window.setSingularityState = function(targetIdx) {
        stateIdx = targetIdx;
        const s = config[stateIdx];

        // Update active class on buttons
        for (let i = 0; i < config.length; i++) {
            const btn = document.getElementById(`btn-state-${i}`);
            if (btn) {
                if (i === stateIdx) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        const tl = gsap.timeline({ defaults: { duration: 3.5, ease: "power2.inOut" } });

        tl.to(diskMaterial.uniforms.uMorph, { value: s.morph }, 0);
        tl.to(diskMaterial.uniforms.uCompression, { value: s.compress }, 0);
        tl.to(diskMaterial.uniforms.uIntensity, { value: s.intensity }, 0);
        tl.to(diskMaterial.uniforms.uOrbitScale, { value: s.orbit }, 0);
        tl.to(diskMaterial.uniforms.uHueShift, { value: s.hueShift }, 0);

        tl.to(auraMat.uniforms.uIntensity, { value: s.intensity }, 0);
        tl.to(auraMat.uniforms.uBaseColor.value, { 
            r: new THREE.Color(s.auraColor).r, 
            g: new THREE.Color(s.auraColor).g, 
            b: new THREE.Color(s.auraColor).b 
        }, 0);

        tl.to(controls, { autoRotateSpeed: s.rotate }, 0);
        tl.to(camera.position, { y: s.camY }, 0);
        tl.to(camControl, { distance: s.camDist }, 0);

        // Sound modulation
        if (osc1 && audioCtx) {
            osc1.frequency.setTargetAtTime(45 + stateIdx * 25, audioCtx.currentTime, 1.5);
        }

        gsap.to([mainTitle, statusText, '.val'], {
            opacity: 0, 
            duration: 0.6, 
            onComplete: () => {
                mainTitle.innerText = s.title;
                statusText.innerText = s.status;
                statusText.style.color = s.color;
                statusText.style.borderColor = s.color;
                velVal.innerText = s.vel;
                velVal.style.color = s.color;
                lensingVal.innerText = s.lensing;
                lensingVal.style.color = s.color;

                gsap.to([mainTitle, statusText, '.val'], { opacity: 1, duration: 1.0 });
            }
        });

        // Reset auto transition timer
        resetAutoCycle();
    };

    function resetAutoCycle() {
        if (autoCycleTimer) clearInterval(autoCycleTimer);
        autoCycleTimer = setInterval(() => {
            let nextState = (stateIdx + 1) % config.length;
            window.setSingularityState(nextState);
        }, 12000);
    }

    resetAutoCycle();

    const clock = new THREE.Clock();

    function animate() {
        const time = clock.getElapsedTime();
        diskMaterial.uniforms.uTime.value = time;
        auraMat.uniforms.uTime.value = time;

        instancedDisk.rotation.y += 0.0006;

        // Smooth distance zoom animation based on state
        const currentDir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        camera.position.x = controls.target.x + currentDir.x * camControl.distance;
        camera.position.z = controls.target.z + currentDir.z * camControl.distance;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start loop
    animate();
</script>
</body>
</html>
